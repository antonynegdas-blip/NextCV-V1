<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primaryBlue" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="32" y1="12" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Fundo Squircle com borda refinada em azul-noite -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Letra "A" estilizada da constelação Astra -->
  <!-- Haste esquerda e ápice do A -->
  <path d="M32 15L17 47h7.5l3.5-7.5h8l3.5 7.5H47L32 15zm-2 19l2-5.5 2 5.5h-4z" fill="url(#primaryBlue)"/>

  <!-- Estrela radiante Astra no ápice/canto superior direito -->
  <path d="M49 13c0 3-2 5-5 5 3 0 5 2 5 5 0-3 2-5 5-5-3 0-5-2-5-5z" fill="url(#accentCyan)"/>
  
  <!-- Ponto estelar secundário -->
  <circle cx="17" cy="18" r="1.5" fill="#38bdf8" opacity="0.6"/>
</svg>
